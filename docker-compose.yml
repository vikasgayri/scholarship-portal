services:
  mongo:
    image: mongo:7
    container_name: scholarhub-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: scholarhub-backend
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/scholarhub
      APP_JWT_SECRET: scholarhub-secret-key-change-me-at-least-32-characters
      APP_CORS_ALLOWED_ORIGINS: https://your-frontend-domain.example
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-ScholarHub <noreply@example.com>}
    ports:
      - "8080:8080"
    depends_on:
      - mongo

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_API_BASE_URL: https://scholarship-portal-zrng.onrender.com
    container_name: scholarhub-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
