services:
  mongo:
    image: mongo:7
    container_name: scholarhub-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: scholarhub-backend
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/scholarhub
      APP_JWT_SECRET: scholarhub-secret-key-change-me-at-least-32-characters
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8080:8080"
    depends_on:
      - mongo

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_API_BASE_URL: http://localhost:8080/api
    container_name: scholarhub-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
