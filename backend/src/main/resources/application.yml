server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: scholarhub-api
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb+srv://user:password@cluster.example.com/scholarhub}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
app:
  jwt:
    secret: ${APP_JWT_SECRET:scholarhub-secret-key-change-me-at-least-32-characters}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://your-frontend-domain.example}
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  mail:
    from: ${APP_MAIL_FROM:}
  resend:
    api-key: ${RESEND_API_KEY:}
    base-url: ${RESEND_BASE_URL:https://api.resend.com}
  verification:
    otp-expiration-minutes: ${APP_VERIFICATION_OTP_EXPIRATION_MINUTES:5}
