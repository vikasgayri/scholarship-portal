server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: scholarhub-api
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/scholarhub}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

app:
  jwt:
    secret: ${APP_JWT_SECRET:scholarhub-secret-key-change-me-at-least-32-characters}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  mail:
    from: ${APP_MAIL_FROM:${SPRING_MAIL_USERNAME:}}
  verification:
    otp-expiration-minutes: ${APP_VERIFICATION_OTP_EXPIRATION_MINUTES:5}
